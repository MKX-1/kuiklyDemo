#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.parallel=true
org.gradle.caching=true

# Kuikly 硬性要求：Gradle 必须跑在 JDK17 上。
# Android Studio 自带的 JBR 是 21/25，与 Kuikly 的 Gradle 插件不兼容，所以这里锁死 JDK17。
# 换机器时改这一行，或在 ~/.gradle/gradle.properties 里覆盖。
org.gradle.java.home=E:\\Android\\Jdk17\\jdk-17.0.16+8

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#KMP（Kotlin Multiplatform）
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# KSP（注解处理器，Kuikly 用它自动生成页面注册表）
ksp.incremental=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
